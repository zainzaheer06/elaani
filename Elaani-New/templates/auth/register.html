<!-- =============================================== -->
<!-- templates/auth/register.html -->
{% extends "base_public.html" %}

{% block title %}التسجيل - إعلاني{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-12 bg-gradient-to-r from-elaani-primary to-elaani-secondary rounded-lg flex items-center justify-center">
                <i class="fas fa-user-plus text-white text-xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                إنشاء حسابك
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                أو
                <a href="{{ url_for('login') }}" class="font-medium text-elaani-primary hover:text-elaani-dark">
                    تسجيل الدخول إلى حساب موجود
                </a>
            </p>
        </div>
        <form class="mt-8 space-y-6" action="#" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700">الاسم الكامل</label>
                    <input id="full-name" name="full-name" type="text" required class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-elaani-primary focus:border-elaani-primary sm:text-sm" placeholder="أدخل اسمك الكامل">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">عنوان البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" required class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-elaani-primary focus:border-elaani-primary sm:text-sm" placeholder="أدخل بريدك الإلكتروني">
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">رقم الهاتف</label>
                    <input id="phone" name="phone" type="tel" required class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-elaani-primary focus:border-elaani-primary sm:text-sm" placeholder="+966 5XXXXXXXX">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">كلمة المرور</label>
                    <input id="password" name="password" type="password" required class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-elaani-primary focus:border-elaani-primary sm:text-sm" placeholder="إنشاء كلمة مرور">
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700">تأكيد كلمة المرور</label>
                    <input id="confirm-password" name="confirm-password" type="password" required class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-elaani-primary focus:border-elaani-primary sm:text-sm" placeholder="أكد كلمة المرور">
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input id="agree-terms" name="agree-terms" type="checkbox" required class="h-4 w-4 text-elaani-primary focus:ring-elaani-primary border-gray-300 rounded">
                <label for="agree-terms" class="block text-sm text-gray-900">
                    أوافق على <a href="#" class="text-elaani-primary hover:text-elaani-dark">شروط الخدمة</a> و <a href="#" class="text-elaani-primary hover:text-elaani-dark">سياسة الخصوصية</a>
                </label>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-elaani-primary hover:bg-elaani-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-elaani-primary">
                    إنشاء حساب
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
